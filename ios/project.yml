name: SongStudy
options:
  bundleIdPrefix: com.npyati
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: AMU26MJZ53
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SongStudy:
    type: application
    platform: iOS
    sources: [SongStudy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.npyati.songstudy
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: SongStudy/Info.plist
      properties:
        CFBundleDisplayName: song.study
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
